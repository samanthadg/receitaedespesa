server:
  port: ${PORT:8080}

spring:
  application:
    name: lancamento
  thymeleaf:
    cache: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lancamento_db}
    username: ${DB_USER:lancamento_user}
    password: ${DB_PASSWORD:lancamento_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    to: ${APP_MAIL_TO:}
    from: ${APP_MAIL_FROM:${SMTP_USER:}}
  public-base-url: ${APP_PUBLIC_BASE_URL:}

logging:
  level:
    org.hibernate.SQL: warn

