<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #eef2f6;
        color: #22303c;
      }
      .wrap {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 16px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .subtitle {
        color: #5b6977;
        font-size: 13px;
      }
      .card {
        background: #fff;
        border: 1px solid #d3dce6;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.04);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
        gap: 12px;
        padding: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #52606d;
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d2de;
        border-radius: 6px;
        padding: 8px 9px;
        font-size: 13px;
        background: #fff;
      }
      .btn-primary {
        border: 1px solid #14579b;
        background: #1b67b1;
        color: #fff;
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-danger {
        border: 1px solid #e0b3b3;
        background: #fff6f6;
        color: #8a1f1f;
        border-radius: 6px;
        padding: 6px 9px;
        font-size: 12px;
        cursor: pointer;
      }
      .linkbtn {
        border: 1px solid #d7dde4;
        background: #fff;
        color: #1f2a37;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #edf1f5;
        text-align: left;
        font-size: 13px;
      }
      th {
        background: #f6f9fc;
        color: #365067;
        font-weight: 600;
        border-bottom: 1px solid #dfe7ef;
      }
      th a {
        color: inherit;
        text-decoration: none;
      }
      th a:hover {
        text-decoration: underline;
      }
      .alert {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
      }
      .alert.ok {
        border: 1px solid #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .alert.err {
        border: 1px solid #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }
      footer {
        margin-top: 14px;
        color: #6b7785;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      form {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      @media (max-width: 820px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Usuários</h1>
          <div class="subtitle">Cadastro e manutenção de usuários do sistema</div>
        </div>
        <div class="subtitle" th:text="${#lists.size(usuarios)} + ' registro(s)'">0 registro(s)</div>
      </header>

      <div th:if="${msg}" class="alert ok" th:text="${msg}">Operação realizada.</div>
      <div th:if="${erro}" class="alert err" th:text="${erro}">Erro.</div>

      <div class="card">
        <form method="post" action="/usuarios" class="form-grid">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" required />
          </div>
          <div class="field">
            <label for="login">Login</label>
            <input id="login" name="login" required />
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required />
          </div>
          <div class="field">
            <label for="situacao">Situação</label>
            <select id="situacao" name="situacao">
              <option value="ATIVO">ATIVO</option>
              <option value="INATIVO">INATIVO</option>
            </select>
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button class="btn-primary" type="submit">Adicionar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th><a th:href="@{/usuarios(campo='id',direcao=${campo == 'id' and direcao == 'asc' ? 'desc' : 'asc'})}">ID</a></th>
              <th><a th:href="@{/usuarios(campo='nome',direcao=${campo == 'nome' and direcao == 'asc' ? 'desc' : 'asc'})}">Nome</a></th>
              <th><a th:href="@{/usuarios(campo='login',direcao=${campo == 'login' and direcao == 'asc' ? 'desc' : 'asc'})}">Login</a></th>
              <th><a th:href="@{/usuarios(campo='situacao',direcao=${campo == 'situacao' and direcao == 'asc' ? 'desc' : 'asc'})}">Situação</a></th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.id}">1</td>
              <td th:text="${u.nome}">Nome</td>
              <td th:text="${u.login}">login</td>
              <td th:text="${u.situacao}">ATIVO</td>
              <td>
                <div class="actions">
                  <a class="linkbtn" th:href="@{'/usuarios/' + ${u.id} + '/editar'}">Editar</a>
                  <form th:action="@{'/usuarios/' + ${u.id} + '/excluir'}" method="post">
                    <button class="btn-danger" type="submit">Excluir</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer>
        <div class="actions">
          <a class="linkbtn" href="/lancamentos">Lançamentos</a>
        </div>
        <form method="post" action="/logout">
          <button class="linkbtn" type="submit">Sair</button>
        </form>
      </footer>
    </div>
  </body>
</html>
