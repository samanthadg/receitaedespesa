<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        font-size: 15px;
        background: radial-gradient(1200px 700px at 10% -10%, rgba(27, 103, 177, 0.14), transparent 55%),
          radial-gradient(1000px 650px at 110% 0%, rgba(14, 165, 233, 0.12), transparent 52%),
          #f3f6fb;
        color: #1f2a37;
      }
      .wrap {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 16px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .subtitle {
        color: #5b6977;
        font-size: 15px;
      }
      .card {
        background: #fff;
        border: 1px solid #dde6f0;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.06);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 12px;
        padding: 14px;
      }
      .field label {
        display: block;
        font-size: 14px;
        color: #52606d;
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d2de;
        border-radius: 6px;
        padding: 11px 11px;
        font-size: 15px;
        background: #fff;
      }
      .btn-primary {
        border: 1px solid #14579b;
        background: #1b67b1;
        color: #fff;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-danger {
        border: 1px solid #e0b3b3;
        background: #fff6f6;
        color: #8a1f1f;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .linkbtn {
        border: 1px solid #d7dde4;
        background: #fff;
        color: #1f2a37;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        font-weight: 600;
      }

      .linkbtn.edit {
        border-color: rgba(27, 103, 177, 0.35);
        background: rgba(27, 103, 177, 0.08);
        color: #155a9b;
      }
      .linkbtn.edit:hover {
        background: rgba(27, 103, 177, 0.12);
      }

      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #d7dde4;
        background: #fff;
        font-size: 13px;
        color: #334e68;
      }
      .tag.ativo {
        border-color: #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .tag.inativo {
        border-color: #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 12px;
        border-bottom: 1px solid #edf1f5;
        text-align: left;
        font-size: 15px;
      }
      th {
        background: linear-gradient(180deg, #f7faff, #f3f7fd);
        color: #2f4860;
        font-weight: 600;
        border-bottom: 1px solid #dfe7ef;
      }
      th a {
        color: inherit;
        text-decoration: none;
      }
      th a:hover {
        text-decoration: underline;
      }
      .alert {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 15px;
      }
      .alert.ok {
        border: 1px solid #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .alert.err {
        border: 1px solid #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }

      .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 9999;
        min-width: 260px;
        max-width: min(420px, calc(100vw - 32px));
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.18);
        border: 1px solid #dde6f0;
        background: #fff;
        color: #1f2a37;
        transform: translateY(-8px);
        opacity: 0;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.ok {
        border-color: #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .toast.err {
        border-color: #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }
      .toast.out {
        transform: translateY(-8px);
        opacity: 0;
      }
      footer {
        margin-top: 14px;
        color: #6b7785;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      form {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .actions form {
        display: inline;
      }

      dialog {
        border: none;
        border-radius: 10px;
        padding: 0;
        width: min(980px, calc(100vw - 24px));
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.28);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.55);
      }
      .modal {
        background: #fff;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid #edf1f5;
      }
      .modal-title {
        font-weight: 700;
        font-size: 18px;
        color: #1f2a37;
      }
      .modal-close {
        border: 1px solid #d7dde4;
        background: #fff;
        color: #1f2a37;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 14px;
        cursor: pointer;
      }
      .modal-close:hover {
        background: #f7f9fb;
      }
      .modal-body {
        padding: 0;
      }
      .modal-actions {
        display: flex;
        justify-content: end;
        gap: 10px;
        padding: 12px 14px 14px;
        border-top: 1px solid #edf1f5;
      }

      #addUserForm.form-grid {
        grid-template-columns: 2.2fr 1fr 1fr 1fr;
        gap: 14px;
        padding: 16px 16px 10px;
      }
      #addUserForm .field input,
      #addUserForm .field select {
        padding: 12px 12px;
        font-size: 16px;
      }

      @media (max-width: 820px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Usuários</h1>
          <div class="subtitle">Cadastro e manutenção de usuários do sistema</div>
        </div>
        <div class="header-actions">
          <div class="nav">
            <a class="linkbtn" href="/lancamentos">Lançamentos</a>
          </div>
          <button class="btn-primary" type="button" onclick="openAddUserModal()">Adicionar usuário</button>
          <div class="subtitle" th:text="${#lists.size(usuarios)} + ' registro(s)'">0 registro(s)</div>
        </div>
      </header>

      <div
        id="toast"
        class="toast"
        th:if="${msg != null or erro != null}"
        th:classappend="${msg != null ? ' ok show' : ' err show'}"
        role="status"
        aria-live="polite"
        th:text="${msg != null ? msg : erro}">
        Operação realizada.
      </div>

      <dialog id="addUserModal" aria-labelledby="addUserModalTitle">
        <div class="modal">
          <div class="modal-header">
            <div id="addUserModalTitle" class="modal-title">Novo usuário</div>
            <button class="modal-close" type="button" onclick="closeAddUserModal()">Fechar</button>
          </div>
          <div class="modal-body">
            <form id="addUserForm" method="post" action="/usuarios" class="form-grid" style="padding-bottom: 8px">
              <div class="field">
                <label for="nomeNovo">Nome</label>
                <input id="nomeNovo" name="nome" required placeholder="Ex.: Maria Silva" />
              </div>
              <div class="field">
                <label for="loginNovo">Login</label>
                <input id="loginNovo" name="login" required placeholder="Ex.: maria" />
              </div>
              <div class="field">
                <label for="senhaNovo">Senha</label>
                <input id="senhaNovo" name="senha" type="password" required />
              </div>
              <div class="field">
                <label for="situacaoNovo">Situação</label>
                <select id="situacaoNovo" name="situacao">
                  <option value="ATIVO">ATIVO</option>
                  <option value="INATIVO">INATIVO</option>
                </select>
              </div>
              <div class="field" style="display:none">
                <label>&nbsp;</label>
                <button type="submit">Adicionar</button>
              </div>
            </form>
          </div>
          <div class="modal-actions">
            <button class="linkbtn" type="button" onclick="closeAddUserModal()">Cancelar</button>
            <button class="btn-primary" type="submit" form="addUserForm">Salvar</button>
          </div>
        </div>
      </dialog>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th><a th:href="@{/usuarios(campo='id',direcao=${campo == 'id' and direcao == 'asc' ? 'desc' : 'asc'})}">ID</a></th>
              <th><a th:href="@{/usuarios(campo='nome',direcao=${campo == 'nome' and direcao == 'asc' ? 'desc' : 'asc'})}">Nome</a></th>
              <th><a th:href="@{/usuarios(campo='login',direcao=${campo == 'login' and direcao == 'asc' ? 'desc' : 'asc'})}">Login</a></th>
              <th><a th:href="@{/usuarios(campo='situacao',direcao=${campo == 'situacao' and direcao == 'asc' ? 'desc' : 'asc'})}">Situação</a></th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.id}">1</td>
              <td th:text="${u.nome}">Nome</td>
              <td th:text="${u.login}">login</td>
              <td>
                <span
                  class="tag"
                  th:classappend="${u.situacao != null ? ' ' + u.situacao.toLowerCase() : ''}"
                  th:text="${u.situacao}">
                  ATIVO
                </span>
              </td>
              <td>
                <div class="actions">
                  <a class="linkbtn edit" th:href="@{'/usuarios/' + ${u.id} + '/editar'}">Editar</a>
                  <form th:action="@{'/usuarios/' + ${u.id} + '/excluir'}" method="post">
                    <button class="btn-danger" type="submit">Excluir</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer>
        <div class="subtitle">Para sair, use o botão ao lado.</div>
        <form method="post" action="/logout">
          <button class="linkbtn" type="submit">Sair</button>
        </form>
      </footer>
    </div>

    <script>
      function openAddUserModal() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        const form = document.getElementById("addUserForm");
        if (form) form.reset();
        if (typeof dialog.showModal === "function") dialog.showModal();
        else dialog.setAttribute("open", "open");
        setTimeout(() => {
          const nome = document.getElementById("nomeNovo");
          if (nome) nome.focus();
        }, 0);
      }

      function closeAddUserModal() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        if (typeof dialog.close === "function") dialog.close();
        else dialog.removeAttribute("open");
      }

      (function wireUpAddUserModalDismiss() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        const form = document.getElementById("addUserForm");
        if (form) {
          form.addEventListener("submit", () => {
            const saveBtn = document.querySelector('button[form="addUserForm"]');
            if (saveBtn) {
              saveBtn.disabled = true;
              saveBtn.textContent = "Salvando...";
            }
          });
        }
        dialog.addEventListener("click", (e) => {
          if (e.target === dialog) closeAddUserModal();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && dialog.hasAttribute("open")) closeAddUserModal();
        });
      })();

      (function wireUpToastAutoHide() {
        const toast = document.getElementById("toast");
        if (!toast) return;
        setTimeout(() => {
          toast.classList.add("out");
        }, 5000);
        setTimeout(() => {
          if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
        }, 5300);
      })();
    </script>
  </body>
</html>
