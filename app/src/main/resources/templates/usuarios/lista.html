<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Usuários - ' + ${appEnv}">Usuários</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(30, 41, 59, 0.85);
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
        --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.2);
        --primary: #10b981;
        --primary-700: #059669;
        --primary-50: rgba(16, 185, 129, 0.15);
        --danger: #ef4444;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        font-size: 15px;
        background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
        background-attachment: fixed;
        color: var(--text);
      }
      .wrap {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 16px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 15px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
        gap: 12px;
        padding: 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.5);
      }
      .field label {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 11px 11px;
        font-size: 15px;
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-50);
      }
      .btn-primary {
        border: 1px solid var(--border);
        background: var(--primary);
        color: #fff;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: var(--primary-700);
      }
      .btn-danger {
        border: 1px solid rgba(239, 68, 68, 0.3);
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.25);
      }
      .linkbtn {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        font-weight: 600;
      }
      .linkbtn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .linkbtn.edit {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.1);
        color: #34d399;
      }
      .linkbtn.edit:hover {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
        font-size: 13px;
        color: var(--muted);
      }
      .tag.ativo {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.1);
        color: #34d399;
      }
      .tag.inativo {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 15px;
      }
      th {
        background: rgba(15, 23, 42, 0.4);
        color: var(--muted);
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      th a {
        color: inherit;
        text-decoration: none;
      }
      th a:hover {
        text-decoration: underline;
      }
      tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.04);
      }
      tbody tr:nth-child(odd) {
        background: transparent;
      }
      tbody tr:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      a {
        color: #60a5fa;
      }
      a:hover {
        color: #93bbfc;
      }
      .alert {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 15px;
      }
      .alert.ok {
        border: 1px solid rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }
      .alert.err {
        border: 1px solid rgba(239, 68, 68, 0.3);
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
      }
      .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 9999;
        min-width: 260px;
        max-width: min(420px, calc(100vw - 32px));
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        transform: translateY(-8px);
        opacity: 0;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast.ok {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }
      .toast.err {
        border-color: rgba(239, 68, 68, 0.3);
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
      }
      .toast.out {
        transform: translateY(-8px);
        opacity: 0;
      }
      footer {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      form {
        margin: 0;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .actions form {
        display: inline;
      }
      dialog {
        border: 1px solid var(--border);
        background: #1e293b;
        color: var(--text);
        border-radius: 10px;
        padding: 0;
        width: min(980px, calc(100vw - 24px));
        box-shadow: var(--shadow);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.6);
      }
      .modal {
        background: transparent;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .modal-title {
        font-weight: 700;
        font-size: 18px;
        color: var(--text);
      }
      .modal-close {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        border-radius: 6px;
        padding: 10px 13px;
        font-size: 14px;
        cursor: pointer;
      }
      .modal-close:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .modal-body {
        padding: 0;
      }
      .modal-actions {
        display: flex;
        justify-content: end;
        gap: 10px;
        padding: 12px 14px 14px;
        border-top: 1px solid var(--border);
      }
      #addUserForm.form-grid {
        grid-template-columns: 2.2fr 1.4fr 2fr 1fr 1fr;
        gap: 14px;
        padding: 16px 16px 10px;
        border-bottom: none;
        background: transparent;
      }
      #addUserForm .field input,
      #addUserForm .field select {
        padding: 12px 12px;
        font-size: 16px;
      }
      @media (max-width: 820px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        #addUserForm.form-grid {
          grid-template-columns: 1fr;
        }
      }
      .badge-env {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        line-height: 1;
      }
      .badge-env.homolog {
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .badge-env.prod {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1 style="display: inline-flex; align-items: center; gap: 10px;">
            <span>Usuários</span>
            <span th:if="${appEnv != null}" 
                  th:classappend="${appEnv == 'Produção' ? 'prod' : 'homolog'}" 
                  class="badge-env" 
                  th:text="${appEnv}">Produção</span>
          </h1>
          <div class="subtitle">Cadastro e manutenção de usuários do sistema</div>
        </div>
        <div class="header-actions">
          <div class="nav">
            <a class="linkbtn" href="/lancamentos">Lançamentos</a>
          </div>
          <button class="btn-primary" type="button" onclick="openAddUserModal()">Adicionar usuário</button>
          <div class="subtitle" th:text="${#lists.size(usuarios)} + ' registro(s)'">0 registro(s)</div>
          <form method="post" action="/logout">
            <button class="linkbtn" type="submit">Sair</button>
          </form>
        </div>
      </header>

      <div
        id="toast"
        class="toast"
        th:if="${msg != null or erro != null}"
        th:classappend="${msg != null ? ' ok show' : ' err show'}"
        role="status"
        aria-live="polite"
        th:text="${msg != null ? msg : erro}">
        Operação realizada.
      </div>

      <dialog id="addUserModal" aria-labelledby="addUserModalTitle">
        <div class="modal">
          <div class="modal-header">
            <div id="addUserModalTitle" class="modal-title">Novo usuário</div>
            <button class="modal-close" type="button" onclick="closeAddUserModal()">Fechar</button>
          </div>
          <div class="modal-body">
            <form id="addUserForm" method="post" action="/usuarios" class="form-grid" style="padding-bottom: 8px">
              <div class="field">
                <label for="nomeNovo">Nome</label>
                <input id="nomeNovo" name="nome" required placeholder="Ex.: Maria Silva" />
              </div>
              <div class="field">
                <label for="loginNovo">Login</label>
                <input id="loginNovo" name="login" required placeholder="Ex.: maria" />
              </div>
              <div class="field">
                <label for="emailNovo">E-mail</label>
                <input id="emailNovo" name="email" type="email" required placeholder="Ex.: maria@email.com" />
              </div>
              <div class="field">
                <label for="senhaNovo">Senha</label>
                <input id="senhaNovo" name="senha" type="password" required />
              </div>
              <div class="field">
                <label for="situacaoNovo">Situação</label>
                <select id="situacaoNovo" name="situacao">
                  <option value="ATIVO">ATIVO</option>
                  <option value="INATIVO">INATIVO</option>
                </select>
              </div>
              <div class="field" style="display:none">
                <label>&nbsp;</label>
                <button type="submit">Adicionar</button>
              </div>
            </form>
          </div>
          <div class="modal-actions">
            <button class="linkbtn" type="button" onclick="closeAddUserModal()">Cancelar</button>
            <button class="btn-primary" type="submit" form="addUserForm">Salvar</button>
          </div>
        </div>
      </dialog>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th><a th:href="@{/usuarios(campo='id',direcao=${campo == 'id' and direcao == 'asc' ? 'desc' : 'asc'})}">ID</a></th>
              <th><a th:href="@{/usuarios(campo='nome',direcao=${campo == 'nome' and direcao == 'asc' ? 'desc' : 'asc'})}">Nome</a></th>
              <th><a th:href="@{/usuarios(campo='login',direcao=${campo == 'login' and direcao == 'asc' ? 'desc' : 'asc'})}">Login</a></th>
              <th><a th:href="@{/usuarios(campo='email',direcao=${campo == 'email' and direcao == 'asc' ? 'desc' : 'asc'})}">E-mail</a></th>
              <th><a th:href="@{/usuarios(campo='situacao',direcao=${campo == 'situacao' and direcao == 'asc' ? 'desc' : 'asc'})}">Situação</a></th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.id}">1</td>
              <td th:text="${u.nome}">Nome</td>
              <td th:text="${u.login}">login</td>
              <td th:text="${u.email}">email</td>
              <td>
                <span
                  class="tag"
                  th:classappend="${u.situacao != null ? ' ' + u.situacao.toLowerCase() : ''}"
                  th:text="${u.situacao}">
                  ATIVO
                </span>
              </td>
              <td>
                <div class="actions">
                  <a class="linkbtn edit" th:href="@{'/usuarios/' + ${u.id} + '/editar'}">Editar</a>
                  <form th:action="@{'/usuarios/' + ${u.id} + '/excluir'}" method="post">
                    <button class="btn-danger" type="submit">Excluir</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <script>
      function openAddUserModal() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        const form = document.getElementById("addUserForm");
        if (form) form.reset();
        if (typeof dialog.showModal === "function") dialog.showModal();
        else dialog.setAttribute("open", "open");
        setTimeout(() => {
          const nome = document.getElementById("nomeNovo");
          if (nome) nome.focus();
        }, 0);
      }

      function closeAddUserModal() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        if (typeof dialog.close === "function") dialog.close();
        else dialog.removeAttribute("open");
      }

      (function wireUpAddUserModalDismiss() {
        const dialog = document.getElementById("addUserModal");
        if (!dialog) return;
        const form = document.getElementById("addUserForm");
        if (form) {
          form.addEventListener("submit", () => {
            const saveBtn = document.querySelector('button[form="addUserForm"]');
            if (saveBtn) {
              saveBtn.disabled = true;
              saveBtn.textContent = "Salvando...";
            }
          });
        }
        dialog.addEventListener("click", (e) => {
          if (e.target === dialog) closeAddUserModal();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && dialog.hasAttribute("open")) closeAddUserModal();
        });
      })();

      (function wireUpToastAutoHide() {
        const toast = document.getElementById("toast");
        if (!toast) return;
        setTimeout(() => {
          toast.classList.add("out");
        }, 5000);
        setTimeout(() => {
          if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
        }, 5300);
      })();
    </script>
  </body>
</html>
