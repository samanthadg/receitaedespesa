<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar usuário</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #eef2f6;
        color: #22303c;
      }
      .wrap {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 16px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .subtitle {
        color: #5b6977;
        font-size: 13px;
      }
      .card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #d3dce6;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.04);
      }
      .grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1.6fr 1fr 1fr;
        gap: 12px;
        padding: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #52606d;
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d2de;
        border-radius: 6px;
        padding: 8px 9px;
        font-size: 13px;
        background: rgba(15, 23, 42, 0.6);
      }
      .row {
        display: flex;
        gap: 10px;
        padding: 0 14px 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        border: 1px solid #14579b;
        background: #1b67b1;
        color: #fff;
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .linkbtn {
        border: 1px solid #d7dde4;
        background: rgba(15, 23, 42, 0.6);
        color: #1f2a37;
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .muted {
        color: #52606d;
        font-size: 12px;
      }
      .btn-primary:hover {
        background: #155a9b;
      }
      .linkbtn:hover {
        background: #f7f9fb;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Editar usuário</h1>
          <div class="subtitle" th:text="${'ID ' + usuario.id}">ID</div>
        </div>
        <a class="linkbtn" href="/usuarios">Voltar</a>
      </header>

      <div class="card">
        <form method="post" th:action="@{'/usuarios/' + ${usuario.id}}">
          <div class="grid">
            <div class="field">
              <label for="nome">Nome</label>
              <input id="nome" name="nome" required th:value="${usuario.nome}" />
            </div>
            <div class="field">
              <label for="login">Login</label>
              <input id="login" name="login" required th:value="${usuario.login}" />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                th:value="${usuario.email}"
                placeholder="Ex.: maria@email.com"
              />
            </div>
            <div class="field">
              <label for="senha">Senha</label>
              <input id="senha" name="senha" type="password" />
              <div class="muted" style="margin-top: 6px">Deixe em branco para manter a senha atual.</div>
            </div>
            <div class="field">
              <label for="situacao">Situação</label>
              <select id="situacao" name="situacao">
                <option value="ATIVO" th:selected="${usuario.situacao == 'ATIVO'}">ATIVO</option>
                <option value="INATIVO" th:selected="${usuario.situacao == 'INATIVO'}">INATIVO</option>
              </select>
            </div>
          </div>
          <div class="row">
            <button class="btn-primary" type="submit">Salvar</button>
            <a class="linkbtn" href="/usuarios">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
