<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acesso</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #eef2f6;
        color: #22303c;
      }
      .container {
        max-width: 430px;
        margin: 86px auto;
        padding: 0 16px;
      }
      .panel {
        background: #fff;
        border: 1px solid #d3dce6;
        border-radius: 8px;
        padding: 22px 22px 16px;
        box-shadow: 0 6px 16px rgba(16, 24, 40, 0.05);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .hint {
        margin: 0 0 16px 0;
        font-size: 13px;
        color: #5c6b79;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 12px 0 6px;
        color: #34485a;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d2de;
        border-radius: 6px;
        padding: 10px 11px;
        font-size: 14px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus {
        outline: none;
        border-color: #2f6fad;
        box-shadow: 0 0 0 3px rgba(47, 111, 173, 0.14);
      }
      .row {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      button {
        border: 1px solid #14579b;
        background: #1b67b1;
        color: #fff;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #155a9b;
      }
      .error {
        margin: 0 0 10px 0;
        padding: 10px 12px;
        border: 1px solid #edc0c0;
        background: #fff5f5;
        color: #832121;
        border-radius: 6px;
        font-size: 13px;
      }
      .footer {
        margin-top: 12px;
        font-size: 12px;
        color: #6b7785;
        line-height: 1.5;
      }
      .footer code {
        background: #eef3f8;
        border: 1px solid #d9e1ea;
        padding: 2px 5px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>Autenticação</h1>
        <p class="hint">Informe seu login e senha para acessar a listagem.</p>

        <div th:if="${error}" class="error" th:text="${error}">Erro</div>

        <form method="post" action="/login">
          <label for="login">Login</label>
          <input id="login" name="login" autocomplete="username" required />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required />

          <div class="row">
            <button type="submit">Entrar</button>
          </div>
        </form>

        <div class="footer">
          Caso você não tenha credenciais, verifique o arquivo <code>data.sql</code> no projeto.
        </div>
      </div>
    </div>
  </body>
</html>
