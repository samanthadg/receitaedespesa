<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lançamentos</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #1f2a37;
        --muted: #5b6977;
        --border: #dde6f0;
        --shadow: 0 10px 26px rgba(16, 24, 40, 0.08);
        --shadow-sm: 0 4px 14px rgba(16, 24, 40, 0.06);
        --primary: #1b67b1;
        --primary-700: #155a9b;
        --primary-50: rgba(27, 103, 177, 0.12);
        --danger: #8a1f1f;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: radial-gradient(1200px 700px at 10% -10%, rgba(27, 103, 177, 0.14), transparent 55%),
          radial-gradient(1000px 650px at 110% 0%, rgba(14, 165, 233, 0.12), transparent 52%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 16px 44px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: end;
        padding: 14px;
        border-bottom: 1px solid #edf1f5;
        background: linear-gradient(180deg, #ffffff, #fbfdff);
      }
      .toolbar .filters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto auto;
        gap: 12px;
        align-items: end;
        width: 100%;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
        gap: 12px;
        padding: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #52606d;
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d2de;
        border-radius: 6px;
        padding: 8px 9px;
        font-size: 13px;
        background: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: #2f6fad;
        box-shadow: 0 0 0 3px var(--primary-50);
      }
      .btn-primary {
        border: 1px solid #14579b;
        background: var(--primary);
        color: #fff;
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-danger {
        border: 1px solid #e0b3b3;
        background: #fff6f6;
        color: var(--danger);
        border-radius: 6px;
        padding: 6px 9px;
        font-size: 12px;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: var(--primary-700);
      }
      .btn-danger:hover {
        background: #ffecec;
      }
      .btn-secondary {
        border: 1px solid #d7dde4;
        background: #fff;
        color: #1f2a37;
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-secondary:hover {
        background: #f7f9fb;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #edf1f5;
        text-align: left;
        font-size: 13px;
      }
      th {
        background: linear-gradient(180deg, #f7faff, #f3f7fd);
        color: #2f4860;
        font-weight: 600;
        border-bottom: 1px solid #dfe7ef;
      }
      th a {
        color: inherit;
        text-decoration: none;
      }
      th a:hover {
        text-decoration: underline;
      }
      tbody tr:hover {
        background: #f7fbff;
      }
      tbody tr:nth-child(even) {
        background: #fcfdff;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #d7dde4;
        background: #fff;
        font-size: 12px;
        color: #334e68;
      }
      .tag.receita {
        border-color: #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .tag.despesa {
        border-color: #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }
      .tag.pendente {
        border-color: #f4dd9c;
        background: #fff8e6;
        color: #7a5a00;
      }
      .valor {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .muted {
        color: #52606d;
      }
      .alert {
        margin: 0 0 10px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
      }
      .alert.ok {
        border: 1px solid #b7e3c0;
        background: #eef9f1;
        color: #1e6b2b;
      }
      .alert.err {
        border: 1px solid #f0c2c2;
        background: #fff2f2;
        color: #8a1f1f;
      }
      footer {
        margin-top: 14px;
        color: #6b7785;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      form {
        margin: 0;
      }
      .linkbtn {
        border: 1px solid #d7dde4;
        background: #fff;
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .linkbtn:hover {
        background: #f7f9fb;
      }
      .linkbtn.primary {
        border-color: #14579b;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
      }
      .linkbtn.primary:hover {
        background: var(--primary-700);
      }
      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .toolbar .filters {
          grid-template-columns: 1fr;
        }
        th:nth-child(1),
        td:nth-child(1) {
          display: none;
        }
      }

      dialog {
        border: none;
        border-radius: 10px;
        padding: 0;
        width: min(720px, calc(100vw - 24px));
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.28);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.55);
      }
      .modal {
        background: #fff;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid #edf1f5;
      }
      .modal-title {
        font-weight: 700;
        font-size: 14px;
        color: #1f2a37;
      }
      .modal-close {
        border: 1px solid #d7dde4;
        background: #fff;
        color: #1f2a37;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .modal-close:hover {
        background: #f7f9fb;
      }
      .modal-body {
        padding: 0;
      }
      .modal-actions {
        display: flex;
        justify-content: end;
        gap: 10px;
        padding: 12px 14px 14px;
        border-top: 1px solid #edf1f5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Listagem de lançamentos</h1>
          <div class="subtitle">Despesas e receitas cadastradas no banco</div>
        </div>
        <div class="header-actions">
          <button class="btn-primary" type="button" onclick="openAddModal()">Adicionar lançamento</button>
          <div class="subtitle">
            <span class="muted" th:text="${#lists.size(lancamentos)} + ' registro(s)'">0 registro(s)</span>
          </div>
        </div>
      </header>

      <div th:if="${msg}" class="alert ok" th:text="${msg}">Operação realizada.</div>
      <div th:if="${erro}" class="alert err" th:text="${erro}">Erro.</div>

      <dialog id="addModal" aria-labelledby="addModalTitle">
        <div class="modal">
          <div class="modal-header">
            <div id="addModalTitle" class="modal-title">Novo lançamento</div>
            <button class="modal-close" type="button" onclick="closeAddModal()">Fechar</button>
          </div>
          <div class="modal-body">
            <form id="addForm" method="post" action="/lancamentos" class="form-grid" style="padding-bottom: 8px">
              <div class="field">
                <label for="descricaoNovo">Descrição</label>
                <input id="descricaoNovo" name="descricao" required placeholder="Ex.: Aluguel, Salário, Mercado..." />
              </div>
              <div class="field">
                <label for="dataLancamentoNovo">Data</label>
                <input id="dataLancamentoNovo" name="dataLancamento" type="date" required />
              </div>
              <div class="field">
                <label for="valorNovo">Valor</label>
                <input id="valorNovo" name="valor" inputmode="decimal" autocomplete="off" placeholder="Ex.: 123,45" required />
              </div>
              <div class="field">
                <label for="tipoLancamentoNovo">Tipo</label>
                <select id="tipoLancamentoNovo" name="tipoLancamento">
                  <option value="RECEITA">RECEITA</option>
                  <option value="DESPESA">DESPESA</option>
                </select>
              </div>
              <div class="field">
                <label for="situacaoNovo">Situação</label>
                <select id="situacaoNovo" name="situacao">
                  <option value="EFETIVADO">EFETIVADO</option>
                  <option value="PENDENTE">PENDENTE</option>
                  <option value="CANCELADO">CANCELADO</option>
                </select>
              </div>
              <div class="field" style="display:none">
                <label>&nbsp;</label>
                <button type="submit">Adicionar</button>
              </div>
            </form>
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" type="button" onclick="closeAddModal()">Cancelar</button>
            <button class="btn-primary" type="submit" form="addForm">Salvar</button>
          </div>
        </div>
      </dialog>

      <div class="card">
        <div class="toolbar">
          <form method="get" action="/lancamentos" class="filters">
            <div class="field">
              <label for="dataDe">Data (de)</label>
              <input id="dataDe" name="dataDe" type="date" th:value="${dataDe}" />
            </div>
            <div class="field">
              <label for="dataAte">Data (até)</label>
              <input id="dataAte" name="dataAte" type="date" th:value="${dataAte}" />
            </div>
            <div class="field">
              <label for="situacaoFiltro">Situação</label>
              <select id="situacaoFiltro" name="situacao">
                <option value="" th:selected="${situacao == ''}">Todas</option>
                <option th:each="s : ${situacoes}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${situacao == s.name()}">
                  EFETIVADO
                </option>
              </select>
            </div>

            <input type="hidden" name="campo" th:value="${campo}" />
            <input type="hidden" name="direcao" th:value="${direcao}" />

            <div class="field">
              <label>&nbsp;</label>
              <button class="linkbtn" type="submit">Filtrar</button>
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <a class="linkbtn primary" th:href="@{/lancamentos/export/pdf(campo=${campo},direcao=${direcao},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">
                Exportar PDF
              </a>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th><a th:href="@{/lancamentos(campo='id',direcao=${campo == 'id' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">ID</a></th>
              <th><a th:href="@{/lancamentos(campo='descricao',direcao=${campo == 'descricao' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">Descrição</a></th>
              <th><a th:href="@{/lancamentos(campo='dataLancamento',direcao=${campo == 'dataLancamento' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">Data</a></th>
              <th><a th:href="@{/lancamentos(campo='valor',direcao=${campo == 'valor' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">Valor</a></th>
              <th><a th:href="@{/lancamentos(campo='tipoLancamento',direcao=${campo == 'tipoLancamento' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">Tipo</a></th>
              <th><a th:href="@{/lancamentos(campo='situacao',direcao=${campo == 'situacao' and direcao == 'asc' ? 'desc' : 'asc'},dataDe=${dataDe},dataAte=${dataAte},situacao=${situacao})}">Situação</a></th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="l : ${lancamentos}">
              <td th:text="${l.id}">1</td>
              <td th:text="${l.descricao}">Descrição</td>
              <td th:text="${#temporals.format(l.dataLancamento, 'dd/MM/yyyy')}">01/01/2026</td>
              <td class="valor" th:text="${#numbers.formatDecimal(l.valor, 1, 'COMMA', 2, 'POINT')}">0,00</td>
              <td>
                <span class="tag" th:classappend="${' ' + l.tipoLancamento.name().toLowerCase()}" th:text="${l.tipoLancamento}">
                  RECEITA
                </span>
              </td>
              <td>
                <span class="tag" th:classappend="${' ' + l.situacao.name().toLowerCase()}" th:text="${l.situacao}">
                  EFETIVADO
                </span>
              </td>
              <td>
                <a class="linkbtn" th:href="@{'/lancamentos/' + ${l.id} + '/editar'}">Editar</a>
                <form th:action="@{'/lancamentos/' + ${l.id} + '/excluir'}" method="post">
                  <button class="btn-danger" type="submit">Excluir</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer>
        <div>
          <a class="linkbtn" href="/usuarios">Usuários</a>
          <span class="muted" style="margin-left: 8px">Para sair, use o botão ao lado.</span>
        </div>
        <form method="post" action="/logout">
          <button class="linkbtn" type="submit">Sair</button>
        </form>
      </footer>
    </div>

    <script>
      function normalizeDecimalPtBrToJava(value) {
        if (!value) return value;
        // Allow "1.234,56" or "1234,56" or "1234.56" -> "1234.56"
        let v = String(value).trim();
        v = v.replace(/\s/g, "");
        const hasComma = v.includes(",");
        if (hasComma) {
          v = v.replace(/\./g, "");
          v = v.replace(",", ".");
        }
        // keep only digits and dot (single)
        v = v.replace(/[^0-9.]/g, "");
        const firstDot = v.indexOf(".");
        if (firstDot !== -1) {
          v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, "");
        }
        return v;
      }

      function openAddModal() {
        const dialog = document.getElementById("addModal");
        if (!dialog) return;
        const form = document.getElementById("addForm");
        if (form) form.reset();
        const dateInput = document.getElementById("dataLancamentoNovo");
        if (dateInput && !dateInput.value) {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, "0");
          const dd = String(now.getDate()).padStart(2, "0");
          dateInput.value = `${yyyy}-${mm}-${dd}`;
        }
        if (typeof dialog.showModal === "function") dialog.showModal();
        else dialog.setAttribute("open", "open");
        setTimeout(() => {
          const desc = document.getElementById("descricaoNovo");
          if (desc) desc.focus();
        }, 0);
      }

      function closeAddModal() {
        const dialog = document.getElementById("addModal");
        if (!dialog) return;
        if (typeof dialog.close === "function") dialog.close();
        else dialog.removeAttribute("open");
      }

      (function wireUpModalDismiss() {
        const dialog = document.getElementById("addModal");
        if (!dialog) return;
        const form = document.getElementById("addForm");
        if (form) {
          form.addEventListener("submit", () => {
            const valor = document.getElementById("valorNovo");
            if (valor) valor.value = normalizeDecimalPtBrToJava(valor.value);
            const saveBtn = document.querySelector('button[form="addForm"]');
            if (saveBtn) {
              saveBtn.disabled = true;
              saveBtn.textContent = "Salvando...";
            }
          });
        }
        dialog.addEventListener("click", (e) => {
          if (e.target === dialog) closeAddModal();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && dialog.hasAttribute("open")) closeAddModal();
        });
      })();
    </script>
  </body>
</html>
