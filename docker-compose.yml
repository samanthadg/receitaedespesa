services:
  admin:
    build:
      context: ./admin-panel
    container_name: lancamento-admin
    ports:
      - "8080:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/lancamento:/opt/lancamento
      - /root/.ssh:/root/.ssh:ro
    environment:
      - PORT=3000
    restart: always

  homolog-db:
    image: postgres:18
    container_name: homolog-db
    environment:
      POSTGRES_DB: lancamento_db
      POSTGRES_USER: lancamento_user
      POSTGRES_PASSWORD: lancamento_pass
    ports:
      - "5433:5432"
    volumes:
      - homolog_pgdata:/var/lib/postgresql
    restart: always

  homolog-app:
    build:
      context: ./app
    container_name: homolog-app
    ports:
      - "8081:3000"
    environment:
      DB_URL: jdbc:postgresql://homolog-db:5432/lancamento_db
      DB_USER: lancamento_user
      DB_PASSWORD: lancamento_pass
      PORT: 3000
      APP_MAIL_ENABLED: "false"
      APP_ENV: "Homologação"
    depends_on:
      - homolog-db
    restart: always

  prod-db:
    image: postgres:18
    container_name: prod-db
    environment:
      POSTGRES_DB: lancamento_db
      POSTGRES_USER: lancamento_user
      POSTGRES_PASSWORD: lancamento_pass
    ports:
      - "5434:5432"
    volumes:
      - prod_pgdata:/var/lib/postgresql
    restart: always

  prod-app:
    build:
      context: ./app
    container_name: prod-app
    ports:
      - "8082:3000"
    environment:
      DB_URL: jdbc:postgresql://prod-db:5432/lancamento_db
      DB_USER: lancamento_user
      DB_PASSWORD: lancamento_pass
      PORT: 3000
      APP_MAIL_ENABLED: "false"
      APP_ENV: "Produção"
    depends_on:
      - prod-db
    restart: always

volumes:
  homolog_pgdata:
  prod_pgdata:
